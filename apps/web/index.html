<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders</title>
    <script>
      // Sets the theme before first paint (no light flash in dark mode). Mirrors
      // readThemePreference/resolveTheme in src/lib/theme.ts — keep the storage
      // key and theme ids in sync with it.
      (function () {
        var themes = ['light', 'dark'];
        var theme;
        try {
          theme = localStorage.getItem('app.theme');
        } catch (e) {}
        if (themes.indexOf(theme) < 0) {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
