name: Deploy stage

# Every push to main: test, then deploy that commit to stage. Fast-forward main
# to develop and the images dev already ran are reused; a merge commit is a new
# SHA and builds its own.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-stage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # Repository variable, set to 'true' once the stage stack exists.
    if: vars.STAGE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: stage
      url: https://stage.socialglider.online
