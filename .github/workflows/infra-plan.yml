name: Infra plan

# Pull requests that touch CloudFormation: lint the templates, then preview
# what merging would change in the target branch's environment - develop is
# dev, stage is stage. The preview is a change set created and discarded by
# infra/cloudformation/deploy.sh; it lands in the job summary. Prod is
# previewed by infra-prod.yml before its approval.
on:
  pull_request:
    branches: [develop, stage]
    paths: ['infra/cloudformation/**']

concurrency:
  group: infra-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run cfn-lint infra/cloudformation/*.yml

  plan:
    name: Preview ${{ github.base_ref == 'stage' && 'stage' || 'dev' }}
    runs-on: ubuntu-latest
    # Set once app-bootstrap has the infra roles.
    if: vars.AWS_INFRA_PLAN_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Trusted for pull_request runs only; it can create and discard change
      # sets, never execute one.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Plan
        env:
          ENVIRONMENT: ${{ github.base_ref == 'stage' && 'stage' || 'dev' }}
        run: infra/cloudformation/deploy.sh "$ENVIRONMENT" plan

      - name: Note bootstrap changes
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -q '^infra/cloudformation/bootstrap'; then
            echo "Bootstrap templates changed. No workflow applies them: run \`infra/cloudformation/deploy.sh bootstrap\` (or \`bootstrap-prod\`) by hand after merging." >> "$GITHUB_STEP_SUMMARY"
          fi
