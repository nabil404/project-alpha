name: Deploy

# The one deploy procedure, called by deploy-dev.yml, deploy-stage.yml and
# deploy-prod.yml. Builds the images only if ECR does not hold them yet, uploads
# the bundle, runs the deploy on the environment's server over SSM, and checks
# /health. The AWS side is infra/cloudformation/; see
# docs/architecture/deployment.md.
on:
  workflow_call:
    inputs:
      environment:
        description: dev, stage or prod - the GitHub environment and the stack's EnvName.
        type: string
        required: true
      url:
        description: The environment's public URL, without a trailing slash.
        type: string
        required: true
      sha:
        description: Commit to deploy. Defaults to the commit that triggered the caller.
        type: string
        default: ''
      build:
        description: Build images that ECR lacks. False means deploy only images that already exist.
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # The deploy role trusts only this repository's GitHub environment of the
    # same name; its variables come from that stack's outputs.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable in ECR, so a re-run, or a commit an earlier
      # environment already built, must not push the same tag again.
      - name: Check for existing images
        id: existing
        env:
          BUILD: ${{ inputs.build }}
        run: |
          for repo in api web; do
            if aws ecr describe-images --repository-name "app-$repo" --image-ids imageTag="$SHA" >/dev/null 2>&1; then
              echo "$repo=true" >> "$GITHUB_OUTPUT"
            elif [ "$BUILD" != true ]; then
              echo "::error::app-$repo:$SHA is not in ECR. This environment deploys only images an earlier environment already ran."
              exit 1
            fi
          done

      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.api != 'true' || steps.existing.outputs.web != 'true'

      - name: Build and push api image
        if: steps.existing.outputs.api != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/app-api:${{ env.SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        if: steps.existing.outputs.web != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/app-web:${{ env.SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # What the server needs besides images: compose, Caddy, the legal pages
      # and its own scripts. It never clones the repository.
      - name: Upload deploy bundle
        env:
          BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          tar czf "$RUNNER_TEMP/bundle.tgz" docker static infra/server
          aws s3 cp "$RUNNER_TEMP/bundle.tgz" "s3://$BUCKET/bundles/$SHA.tgz"

      - name: Deploy
        env:
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
        run: infra/ci/ssm-deploy.sh "$INSTANCE_ID" "$SHA"

      - name: Smoke test
        env:
          URL: ${{ inputs.url }}
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$URL/health"
