name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 22

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379
      # Set this secret to enable `atlas migrate lint`; see the step below.
      ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/shared build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      # Atlas needs Docker for its dev database; the runner provides it.
      - uses: ariga/setup-atlas@v0

      - name: Check for migrations
        id: migrations
        run: |
          if [ -n "$(find apps/api/db/migrations -maxdepth 1 -name '*.sql' -print -quit)" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No migrations yet - skipping Atlas lint and apply.'
          fi

      # `atlas migrate lint` is an Atlas Pro feature as of v0.38, so it runs
      # only once an ATLAS_TOKEN secret exists. Generated migrations are
      # reviewed by hand either way.
      - name: Lint migrations
        if: steps.migrations.outputs.present == 'true' && env.ATLAS_TOKEN != ''
        working-directory: apps/api
        run: |
          atlas login --token "$ATLAS_TOKEN"
          atlas migrate lint --env ci --latest 1

      - name: Apply migrations to a fresh database
        if: steps.migrations.outputs.present == 'true'
        working-directory: apps/api
        run: atlas migrate apply --env ci

      - name: Check generated types are current
        working-directory: apps/api
        run: |
          pnpm db:types
          git diff --exit-code src/database/database.types.ts \
            || { echo "::error::database.types.ts is stale - run 'pnpm --filter api db:types' and commit"; exit 1; }

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: app-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: app-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            docker compose -f docker/compose.yml build
            # Migrations run before the new code starts serving. The api image
            # carries no Atlas binary, so Atlas runs from its own image on the
            # stack's network.
            set -a; . ./apps/api/.env; set +a
            if [ -n "$(find apps/api/db/migrations -maxdepth 1 -name '*.sql' -print -quit)" ]; then
              docker run --rm --network app_default \
                -v "$PWD/apps/api/db/migrations:/migrations" \
                arigaio/atlas:latest migrate apply --dir file:///migrations --url "$DATABASE_URL"
            fi
            docker compose -f docker/compose.yml up -d --remove-orphans
            docker image prune -f
