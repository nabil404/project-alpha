name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 22

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      # drizzle-kit, the migrate script and the Better Auth CLI connect as the owner.
      DATABASE_ADMIN_URL: postgres://app:app@localhost:5432/app
      # The application's restricted connection. It is the same superuser here
      # only because app_runtime has no password until an environment sets one;
      # nothing in this job queries as it, and db:verify-rls uses the admin URL.
      DATABASE_URL: postgres://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/shared build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      - name: Apply migrations to a fresh database
        working-directory: apps/api
        run: pnpm db:migrate

      # drizzle-kit generates ENABLE and CREATE POLICY from pgPolicy, but not
      # FORCE, roles or grants - those are hand-authored, so nothing diffs them.
      - name: Verify RLS coverage
        working-directory: apps/api
        run: pnpm db:verify-rls

      # The schema is the source of truth for types, so there is no codegen to
      # drift. This catches a schema edit committed without its migration.
      - name: Check migrations are current
        working-directory: apps/api
        run: |
          pnpm db:generate
          git diff --exit-code db/migrations \
            || { echo "::error::A schema change has no migration - run 'pnpm --filter api db:generate' and commit"; exit 1; }

