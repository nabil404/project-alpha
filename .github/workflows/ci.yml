name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push cancels a pull request's run, but never a branch run: on
# develop that would cut a deploy off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 22

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      # drizzle-kit, the migrate script and the Better Auth CLI connect as the owner.
      DATABASE_ADMIN_URL: postgres://app:app@localhost:5432/app
      # The application's restricted connection. It is the same superuser here
      # only because app_runtime has no password until an environment sets one;
      # nothing in this job queries as it, and db:verify-rls uses the admin URL.
      DATABASE_URL: postgres://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/shared build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

      # Before the tests: the database-backed specs need the schema in place.
      - name: Apply migrations to a fresh database
        working-directory: apps/api
        run: pnpm db:migrate

      - run: pnpm test

      # drizzle-kit generates ENABLE and CREATE POLICY from pgPolicy, but not
      # FORCE, roles or grants - those are hand-authored, so nothing diffs them.
      - name: Verify RLS coverage
        working-directory: apps/api
        run: pnpm db:verify-rls

      # The schema is the source of truth for types, so there is no codegen to
      # drift. This catches a schema edit committed without its migration.
      - name: Check migrations are current
        working-directory: apps/api
        run: |
          pnpm db:generate
          git diff --exit-code db/migrations \
            || { echo "::error::A schema change has no migration - run 'pnpm --filter api db:generate' and commit"; exit 1; }

  # Every merge to develop: builds the images once, pushes them to ECR tagged
  # with the commit, and deploys that commit to the dev server over SSM. The AWS side is
  # infra/cloudformation/; docs/architecture/deployment.md has the setup.
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: test
    # DEV_DEPLOY_ENABLED is a repository variable, set to 'true' once the dev
    # stack exists, so develop stays green until then.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.DEV_DEPLOY_ENABLED == 'true'
    environment:
      name: dev
      url: https://dev.socialglider.online
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The role trusts only this repository's `dev` environment; the
      # variables are set on that environment from the stack's outputs.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable in ECR, so a re-run must not push the same tag again.
      - name: Check for existing images
        id: existing
        run: |
          for repo in api web; do
            if aws ecr describe-images --repository-name "app-$repo" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
              echo "$repo=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: docker/setup-buildx-action@v3

      - name: Build and push api image
        if: steps.existing.outputs.api != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/app-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        if: steps.existing.outputs.web != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/app-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # What the server needs besides images: compose, Caddy, the legal pages
      # and its own scripts. It never clones the repository.
      - name: Upload deploy bundle
        run: |
          tar czf "$RUNNER_TEMP/bundle.tgz" docker static infra/server
          aws s3 cp "$RUNNER_TEMP/bundle.tgz" "s3://${{ vars.ARTIFACTS_BUCKET }}/bundles/$GITHUB_SHA.tgz"

      - name: Deploy
        run: infra/ci/ssm-deploy.sh "${{ vars.INSTANCE_ID }}" "$GITHUB_SHA"

      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://dev.socialglider.online/health
