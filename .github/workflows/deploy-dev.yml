name: Deploy dev

# Every merge to develop: test, then deploy that commit to
# dev.socialglider.online, building its images.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Deploys queue rather than cancel: a cancelled run could stop halfway.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # DEV_DEPLOY_ENABLED is a repository variable, set to 'true' once the dev
    # stack exists; until then this workflow only tests.
    if: vars.DEV_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      url: https://dev.socialglider.online
