# Production stack on a single VPS: every role, one compose project.
#
# apps/api/.env is the repo's only env file, and compose needs it passed
# explicitly - without --env-file it would look for docker/.env instead:
#   docker compose --env-file apps/api/.env -f docker/compose.yml up -d
#
# Staging runs this same file with a separate env file and project name:
#   docker compose -p app-staging --env-file apps/api/.env.staging -f docker/compose.yml up -d
#
# Each role lives in its own file so it can move to its own server later by
# running that file alone there - see docs/deployment.md. Nothing in a role file
# assumes the others are present; this file adds only the wiring that holds
# when they share a host.
name: app

include:
  - compose.data.yml
  - compose.api.yml
  - compose.worker.yml
  - compose.web.yml

# Startup ordering, valid only when every role is in this one project. A role
# file cannot declare it: compose rejects a dependency on a service it does not
# define, even with `required: false`.
services:
  api:
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  caddy:
    depends_on:
      - api
