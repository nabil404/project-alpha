# Overlay for the dev server (dev.socialglider.online), on top of compose.yml:
#   docker compose --env-file environments/.env -f docker/compose.yml -f docker/compose.dev.yml …
#
# Container sizing only, matched to infra/cloudformation/environments/dev.params
# (t3.small, 2 GiB); change the two together. App settings come from Parameter Store
# under /social-glider/dev/. A container over its limit restarts instead of
# starving Postgres.
services:
  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=50
    deploy:
      resources:
        limits: { memory: 512M }

  redis:
    deploy:
      resources:
        limits: { memory: 192M }

  api:
    deploy:
      resources:
        limits: { memory: 384M }

  worker:
    deploy:
      resources:
        limits: { memory: 384M }

  caddy:
    deploy:
      resources:
        limits: { memory: 128M }
