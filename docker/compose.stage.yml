# Overlay for the stage server: a prod rehearsal, smaller, on top of compose.yml:
#   docker compose --env-file apps/api/.env -f docker/compose.yml -f docker/compose.stage.yml …
#
# Only what differs per environment belongs here: container sizing, sized to
# the instance in infra/cloudformation/environments/stage.params (t3.small, 2 GiB).
# Change the two together. Application settings are not here - they come from
# Parameter Store under /social-glider/stage/, rendered into apps/api/.env on deploy.
#
# Limits leave headroom for the OS and Docker; a container that exceeds one is
# killed and restarted rather than starving Postgres.
services:
  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=50
    deploy:
      resources:
        limits: { memory: 512M }

  redis:
    deploy:
      resources:
        limits: { memory: 192M }

  api:
    deploy:
      resources:
        limits: { memory: 384M }

  worker:
    deploy:
      resources:
        limits: { memory: 384M }

  caddy:
    deploy:
      resources:
        limits: { memory: 128M }
