# API role: the NestJS HTTP server. Runs alone on an api server once split out:
#   docker compose --env-file apps/api/.env -f docker/compose.api.yml up -d
name: app

services:
  api:
    extends: { file: compose.app.yml, service: app }
    command: ['node', 'dist/main.js']
    # Caddy reaches it over the compose network on one host. The published port
    # is for Caddy on another server: BIND_IP stays on loopback until then, and
    # becomes this server's private address afterwards.
    ports:
      - '${BIND_IP:-127.0.0.1}:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
