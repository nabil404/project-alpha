AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Account-wide pieces for production only, deployed as stack app-bootstrap-prod:
  prod's own ECR repositories and deploy-bundle bucket. A deliberate duplicate
  of bootstrap.yml (dev and stage) so production can diverge - its own AWS
  account, stricter policies - without touching the other environments. Prod
  never builds: deploy-prod.yml copies the images stage ran into these
  repositories. See docs/architecture/deployment.md.

Parameters:
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      An account holds one provider per URL. While prod shares the account with
      dev and stage, app-bootstrap already created it, so this stays false.
      Set true when prod moves to an account of its own.
  GitHubRepo:
    Type: String
    Default: nabil404/project-alpha

Conditions:
  CreateOidc: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Tags are commit SHAs and immutable, so an image can never change under a
  # tag that has already been deployed.
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: app-prod-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the last 30 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},
            "action":{"type":"expire"}}]}

  WebRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: app-prod-web
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the last 30 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},
            "action":{"type":"expire"}}]}

  # Deploy bundles: docker/, static/ and infra/server/ of one commit, which the
  # server fetches instead of cloning the repository.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-bundles
            Status: Enabled
            Prefix: bundles/
            ExpirationInDays: 30

  ArtifactsBucketTlsOnly:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub '${ArtifactsBucket.Arn}/*'
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  # --- Infra workflows (docs/architecture/deployment.md, "Infra workflows").
  # CloudFormation applies changes to app-prod as this role, so the roles
  # GitHub assumes below only hand change sets to CloudFormation; none of them
  # can create IAM roles itself. It manages only IAM roles and instance
  # profiles named after those stacks, which CloudFormation's generated names
  # are. Anything a merged template asks for, it does - so review infra PRs as
  # you would an AWS admin login.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'CloudFormation applies app-prod as this role (${AWS::StackName})'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess'
      Policies:
        - PolicyName: environment-iam
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRolePolicies
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/app-prod-*'
              - Effect: Allow
                Action:
                  - iam:AddRoleToInstanceProfile
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/app-prod-*'

  # Previews prod changes in infra-prod.yml, run from main, before approval. Creates and discards change sets; cannot execute one.
  InfraPlanRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
      Policies:
        - PolicyName: plan
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:TagResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/app-prod/*'
              # Finds the execution role in this stack's outputs.
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals: { 'iam:PassedToService': cloudformation.amazonaws.com }

  # Applies app-prod from the `prod` GitHub environment only.
  InfraProdRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubRepo}:environment:prod'
      Policies:
        - PolicyName: apply
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:TagResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/app-prod/*'
              # Finds the execution role in this stack's outputs.
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals: { 'iam:PassedToService': cloudformation.amazonaws.com }

Outputs:
  CloudFormationExecutionRoleArn:
    Description: Read by infra/cloudformation/deploy.sh.
    Value: !GetAtt CloudFormationExecutionRole.Arn
  InfraPlanRoleArn:
    Description: GitHub repository variable AWS_PROD_INFRA_PLAN_ROLE_ARN.
    Value: !GetAtt InfraPlanRole.Arn
  InfraProdRoleArn:
    Description: Variable AWS_INFRA_ROLE_ARN of the `prod` GitHub environment.
    Value: !GetAtt InfraProdRole.Arn
  ApiRepositoryName:
    Value: !Ref ApiRepository
    Export: { Name: !Sub '${AWS::StackName}-ApiRepositoryName' }
  WebRepositoryName:
    Value: !Ref WebRepository
    Export: { Name: !Sub '${AWS::StackName}-WebRepositoryName' }
  ApiRepositoryArn:
    Value: !GetAtt ApiRepository.Arn
    Export: { Name: !Sub '${AWS::StackName}-ApiRepositoryArn' }
  WebRepositoryArn:
    Value: !GetAtt WebRepository.Arn
    Export: { Name: !Sub '${AWS::StackName}-WebRepositoryArn' }
  RegistryUri:
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'
    Export: { Name: !Sub '${AWS::StackName}-RegistryUri' }
  ArtifactsBucketName:
    Description: GitHub variable ARTIFACTS_BUCKET.
    Value: !Ref ArtifactsBucket
    Export: { Name: !Sub '${AWS::StackName}-ArtifactsBucket' }
  ArtifactsBucketArn:
    Value: !GetAtt ArtifactsBucket.Arn
    Export: { Name: !Sub '${AWS::StackName}-ArtifactsBucketArn' }
